# Builds Loom and runs the headless check suites on every push to main and every pull request.
# Window suites (-Ui, chat-view, startup …) need a desktop and a Vulkan GPU, which hosted runners lack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and run headless checks
        shell: pwsh
        run: ./scripts/check.ps1 -Suite default,features

      - name: Collect logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/logs -Force | Out-Null
          if ( Test-Path "$env:TEMP\Lokn" ) { Copy-Item "$env:TEMP\Lokn\*.log" artifacts/logs -ErrorAction Ignore }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: artifacts/logs
          if-no-files-found: ignore
