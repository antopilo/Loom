<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report kit samples</title>
<style>
	body { margin: 0; padding: 32px; background: radial-gradient(circle at 20% 10%, #efe3bd, #9fb596 60%, #7f9c86); font: 13px "Segoe UI", sans-serif; }
	.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
	figure { margin: 0; }
	iframe { width: 100%; height: 1100px; border: 0; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); background: #fff; }
	figcaption { color: #2b2620; margin: 0 0 8px 4px; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
</style>
</head>
<body>
<div class="row">
	<figure><figcaption>Peach · performance</figcaption><iframe src="sample.html"></iframe></figure>
	<figure><figcaption>Mint · weekly recap</figcaption><iframe src="recap.html"></iframe></figure>
	<figure><figcaption>Lavender · metrics</figcaption><iframe src="traffic.html"></iframe></figure>
</div>
</body>
</html>
